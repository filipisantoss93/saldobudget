name: Gerar pacote de ícones web

on:
  push:
    branches: [main]
    paths:
      - icon-source.svg
      - site.webmanifest
      - .github/workflows/generate-web-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar conversores
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Gerar PNG, favicon e ícone maskable
        run: |
          rsvg-convert -w 16 -h 16 icon-source.svg -o icon-16x16.png
          rsvg-convert -w 32 -h 32 icon-source.svg -o icon-32x32.png
          rsvg-convert -w 48 -h 48 icon-source.svg -o icon-48x48.png
          rsvg-convert -w 180 -h 180 icon-source.svg -o apple-touch-icon.png
          rsvg-convert -w 192 -h 192 icon-source.svg -o icon-192x192.png
          rsvg-convert -w 512 -h 512 icon-source.svg -o icon-512x512.png
          rsvg-convert -w 410 -h 410 icon-source.svg -o /tmp/icon-inner.png
          convert -size 512x512 xc:'#111315' /tmp/icon-inner.png -gravity center -composite icon-maskable-512x512.png
          convert icon-16x16.png icon-32x32.png icon-48x48.png favicon.ico

      - name: Vincular pacote ao HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<title>Painel de Cortesia · Comasa Volkswagen</title>'
          links = '''<title>Painel de Cortesia · Comasa Volkswagen</title>
          <meta name="theme-color" content="#0A84FF">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="Painel Cortesia">
          <link rel="manifest" href="/site.webmanifest">
          <link rel="icon" href="/favicon.ico" sizes="any">
          <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png">
          <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">'''
          if '<link rel="manifest" href="/site.webmanifest">' not in html:
              html = html.replace(marker, links)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Publicar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.ico icon-16x16.png icon-32x32.png icon-48x48.png apple-touch-icon.png icon-192x192.png icon-512x512.png icon-maskable-512x512.png
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Gerar pacote de ícones para Web, Android, iOS e PWA"
            git push
          fi
