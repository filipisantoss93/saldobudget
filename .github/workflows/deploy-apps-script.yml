name: Deploy Google Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - "package.json"
      - ".claspignore"
      - ".github/workflows/deploy-apps-script.yml"

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Validar secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "Secret CLASPRC_JSON ausente" && exit 1)
          test -n "$CLASP_SCRIPT_ID" || (echo "Secret CLASP_SCRIPT_ID ausente" && exit 1)
          test -n "$CLASP_DEPLOYMENT_ID" || (echo "Secret CLASP_DEPLOYMENT_ID ausente" && exit 1)

      - name: Configurar autenticação e projeto
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node <<'NODE'
          const fs = require('fs');
          const authPath = `${process.env.HOME}/.clasprc.json`;
          const auth = JSON.parse(fs.readFileSync(authPath, 'utf8'));
          const DEFAULT_CLIENT_ID = '1072944905499-vm2v2i5dvn0a0d2o4ca36i1vge8cvbn0.apps.googleusercontent.com';

          function normalizeCredential(input, inherited = {}) {
            if (!input || typeof input !== 'object') return null;
            const refreshToken = input.refresh_token || input.refreshToken;
            const accessToken = input.access_token || input.accessToken;
            if (!refreshToken && !accessToken) return null;
            const clientId = input.client_id || input.clientId || inherited.client_id || inherited.clientId || DEFAULT_CLIENT_ID;
            const clientSecret = input.client_secret || input.clientSecret || inherited.client_secret || inherited.clientSecret;
            const expiryDate = input.expiry_date || input.expiryDate || input.exprity_date;
            const tokenType = input.token_type || input.tokenType;
            return {
              type: 'authorized_user',
              client_id: clientId,
              ...(clientSecret ? {client_secret: clientSecret} : {}),
              ...(refreshToken ? {refresh_token: refreshToken} : {}),
              ...(accessToken ? {access_token: accessToken} : {}),
              ...(expiryDate ? {expiry_date: expiryDate} : {}),
              ...(tokenType ? {token_type: tokenType} : {})
            };
          }

          let defaultCredential = null;

          if (auth.tokens && typeof auth.tokens === 'object') {
            if (auth.tokens.default) defaultCredential = normalizeCredential(auth.tokens.default, auth.tokens.default);
            if (!defaultCredential) {
              const firstKey = Object.keys(auth.tokens).find(key => normalizeCredential(auth.tokens[key], auth.tokens[key]));
              if (firstKey) defaultCredential = normalizeCredential(auth.tokens[firstKey], auth.tokens[firstKey]);
            }
          }

          if (!defaultCredential && auth.token) defaultCredential = normalizeCredential(auth.token, auth.oauth2ClientSettings || auth);
          if (!defaultCredential && auth.credentials) defaultCredential = normalizeCredential(auth.credentials, auth);
          if (!defaultCredential) defaultCredential = normalizeCredential(auth, auth);

          if (defaultCredential) {
            auth.tokens = auth.tokens && typeof auth.tokens === 'object' ? auth.tokens : {};
            auth.tokens.default = defaultCredential;
          }

          fs.writeFileSync(authPath, JSON.stringify(auth), {mode: 0o600});
          fs.writeFileSync('.clasp.json', JSON.stringify({scriptId: process.env.CLASP_SCRIPT_ID, rootDir: 'apps-script'}));
          NODE
          chmod 600 "$HOME/.clasprc.json" .clasp.json

      - name: Conferir autenticação
        run: |
          AUTH_STATUS="$(npx clasp --auth "$HOME/.clasprc.json" show-authorized-user --json)"
          echo "$AUTH_STATUS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s); if(!x.loggedIn){console.error('CLASPRC_JSON não contém uma sessão OAuth reutilizável. Gere novamente com clasp login e atualize o secret.'); process.exit(1)} console.log('Autenticação clasp válida.')})"

      - name: Conferir arquivos do Apps Script
        run: npx clasp --auth "$HOME/.clasprc.json" show-file-status

      - name: Enviar código para o Apps Script
        run: npx clasp --auth "$HOME/.clasprc.json" push --force

      - name: Atualizar implantação Web App existente
        env:
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: |
          npx clasp --auth "$HOME/.clasprc.json" create-deployment \
            --deploymentId "$CLASP_DEPLOYMENT_ID" \
            --description "GitHub ${GITHUB_SHA::7}"
